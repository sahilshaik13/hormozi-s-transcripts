# Render Blueprint — no persistent disk required (data baked into Docker image).
#
# BEFORE first deploy, run:  scripts\stage_for_render.bat
# That force-adds hormozi-brain/ + hormozi-index/ to git (private repo only).

services:
  - type: web
    name: hormozi-brain
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: HORMOZI_WEB_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
