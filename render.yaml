# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect repo → New Blueprint → point at this file.
#
# After first deploy, upload hormozi-brain/ and hormozi-index/ to the persistent
# disk (or uncomment COPY lines in Dockerfile and redeploy from a machine that
# has the data).

services:
  - type: web
    name: hormozi-brain
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: HORMOZI_WEB_TOKEN
        sync: false
      - key: HORMOZI_VAULT_DIR
        value: /data/hormozi-brain
      - key: HORMOZI_INDEX_DIR
        value: /data/hormozi-index
      - key: PYTHON_VERSION
        value: "3.12.0"
    disk:
      name: hormozi-data
      mountPath: /data
      sizeGB: 2
