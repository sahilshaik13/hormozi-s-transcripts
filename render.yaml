# Render Blueprint — no persistent disk. Data must be in git OR render-data.zip.
#
# Option A: scripts\stage_for_render.bat  → commit + push folders
# Option B: scripts\pack_render_data.bat → git add -f render-data.zip → push

services:
  - type: web
    name: hormozi-brain
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_CHAT_MODEL
        value: "glm-4.7:cloud"
      - key: EMBED_BACKEND
        value: "fastembed"
      - key: FASTEMBED_MODEL
        value: "BAAI/bge-small-en-v1.5"
      - key: HORMOZI_WEB_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
